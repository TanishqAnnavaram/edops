services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: edops
      POSTGRES_PASSWORD: edops
      POSTGRES_DB: edops
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edops -d edops"]
      interval: 3s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4.2.9-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
