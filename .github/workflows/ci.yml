name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Throwaway credentials for CI-only containers; same dev values as .env.example.
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: edops
          POSTGRES_PASSWORD: edops
          POSTGRES_DB: edops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edops -d edops"
          --health-interval 3s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.2.9-management
        env:
          RABBITMQ_DEFAULT_USER: edops
          RABBITMQ_DEFAULT_PASS: edops
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
          --health-start-period 20s
    env:
      # conftest creates edops_test and rebuilds its schema from db/init.sql.
      TEST_DATABASE_URL: postgresql://edops:edops@localhost:5432/edops_test
      RABBITMQ_URL: amqp://edops:edops@localhost:5672/
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # Includes tests/test_chaos.py: real processes are killed and restarted on Linux here.
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t edops-app .
