# Shared settings for every app process: one image, a different command per service.
x-app: &app
  build: .
  image: edops-app
  env_file: .env
  environment: &app-env
    # .env points at localhost for host-side tools; inside the network the hosts are service names.
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped

# Background processes have no HTTP port; their main loop touches HEALTH_FILE.
x-heartbeat: &heartbeat
  test: ["CMD", "python", "-m", "app.health"]
  interval: 5s
  timeout: 3s
  retries: 3
  start_period: 10s

services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # $$ defers expansion to the container's shell, which has POSTGRES_* set.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4.2.9-management
    environment:
      # The built-in guest user only accepts connections from localhost, i.e. not from other
      # containers.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  order-api:
    <<: *app
    environment:
      <<: *app-env
      # Local demo dashboard at /demo. Never set on a hosted service (the app refuses to start
      # if it sees a hosting platform's variables alongside it).
      DEMO_UI: "1"
    ports:
      - "8000:8000"
    healthcheck:
      # The slim image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  outbox-relay:
    <<: *app
    command: ["python", "-m", "app.relay"]
    environment:
      <<: *app-env
      HEALTH_FILE: /tmp/health
    healthcheck: *heartbeat

  payment-worker:
    <<: *app
    command: ["python", "-m", "app.workers.payment"]
    environment:
      <<: *app-env
      HEALTH_FILE: /tmp/health
    healthcheck: *heartbeat

  inventory-worker:
    <<: *app
    command: ["python", "-m", "app.workers.inventory"]
    environment:
      <<: *app-env
      HEALTH_FILE: /tmp/health
    healthcheck: *heartbeat

  orchestrator:
    <<: *app
    command: ["python", "-m", "app.orchestrator"]
    environment:
      <<: *app-env
      HEALTH_FILE: /tmp/health
    healthcheck: *heartbeat

  # Browser UI for Postgres, for local demos only (docs/demo-ui.md). Bound to 127.0.0.1 so it is
  # not reachable from other machines on the network.
  adminer:
    # 5.5.1, not 6.x: 6.1.1 prints PHP warnings on the page after login (seen 2026-10-20).
    image: adminer:5.5.1
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8080') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
